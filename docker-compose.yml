services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudsketch
      POSTGRES_PASSWORD: cloudsketch
      POSTGRES_DB: cloudsketch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsketch"]
      interval: 3s
      retries: 10

  parser:
    build: ./grammar
    ports: ["7070:7070"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cloudsketch:cloudsketch@postgres:5432/cloudsketch
      PARSER_URL: http://parser:7070
      # Ollama running on your host machine
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: http://localhost:5173
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      parser: { condition: service_started }

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
